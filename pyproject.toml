[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-score-studio"
version = "1.2.0"
description = "Traceable offline image sonification"
requires-python = ">=3.12"
dependencies = ["Pillow==11.3.0"]

[project.scripts]
image-score = "image_score.cli:main"
image-score-edit = "image_score.cli:edit_main"
image-score-editor = "image_score.cli:editor_main"

[tool.setuptools.package-data]
image_score = ["*.html", "*.js"]

[tool.setuptools.packages.find]
include = ["image_score*"]
